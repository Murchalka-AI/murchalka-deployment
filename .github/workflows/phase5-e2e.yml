name: Phase 5 E2E

on:
  workflow_call:
    inputs:
      tag:
        description: Coordinated release tag
        required: true
        type: string
      ollama_model:
        description: Ollama model used for the acceptance turn
        required: false
        default: llama3.2:1b
        type: string
    secrets:
      BUNDLE_PUBLISHER_PUBLIC_KEY_PEM: { required: true }
      MURCHALKA_BUNDLE_SIGNING_KEY_ID: { required: true }
      PHASE5_E2E_PASSWORD: { required: true }
  workflow_dispatch:
    inputs:
      tag:
        description: Coordinated release tag
        required: true
        default: v0.3.3
      ollama_model:
        description: Ollama model used for the acceptance turn
        required: true
        default: llama3.2:1b

permissions:
  contents: read
  packages: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out deployment
        uses: actions/checkout@v7
        with: { persist-credentials: false }

      - name: Resolve the immutable component lock
        id: components
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          lock="releases/minimal-core.lock.json"
          test "$(jq -r '.deploymentTag' "${lock}")" = "${REQUESTED_TAG}"
          echo "web_tag=$(jq -r '.web.tag' "${lock}")" >> "${GITHUB_OUTPUT}"
          echo "runtime_image=$(jq -r '.runtime.image' "${lock}")" >> "${GITHUB_OUTPUT}"
          echo "web_image=$(jq -r '.web.image' "${lock}")" >> "${GITHUB_OUTPUT}"
          echo "ollama_image=$(jq -r '.ollama.image' "${lock}")" >> "${GITHUB_OUTPUT}"

      - name: Check out coordinated Web shell
        uses: actions/checkout@v7
        with:
          repository: Murchalka-AI/murchalka-web
          ref: ${{ steps.components.outputs.web_tag }}
          path: murchalka-web
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: murchalka-web/package-lock.json

      - name: Authenticate to GitHub Packages
        env: { PACKAGE_TOKEN: "${{ github.token }}" }
        run: dotnet nuget update source murchalka --username "${GITHUB_ACTOR}" --password "${PACKAGE_TOKEN}" --store-password-in-clear-text --configfile NuGet.Config

      - name: Restore acceptance tools
        run: dotnet restore Murchalka.Deployment.slnx --configfile NuGet.Config

      - name: Install browser acceptance dependencies
        working-directory: murchalka-web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Download and verify coordinated module bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/modules/inbox
          while IFS=$'\t' read -r repository release_tag; do
            release_version="${release_tag#v}"
            download="${RUNNER_TEMP}/${repository}"
            mkdir -p "${download}"
            gh release download "${release_tag}" \
              --repo "Murchalka-AI/${repository}" \
              --pattern "*-${release_version}-linux-x64.murchalka" \
              --pattern SHA256SUMS \
              --dir "${download}"
            (cd "${download}" && sha256sum --check --ignore-missing SHA256SUMS)
            cp "${download}"/*-linux-x64.murchalka runtime/modules/inbox/
          done < <(jq -r '.modules[] | [.repository, .tag] | @tsv' releases/minimal-core.lock.json)
          test "$(find runtime/modules/inbox -name '*.murchalka' | wc -l)" -eq 17

      - name: Prepare local trust and digest-bound grants
        shell: bash
        env:
          PUBLISHER_PUBLIC_KEY: ${{ secrets.BUNDLE_PUBLISHER_PUBLIC_KEY_PEM }}
          PUBLISHER_KEY_ID: ${{ secrets.MURCHALKA_BUNDLE_SIGNING_KEY_ID }}
        run: |
          test -n "${PUBLISHER_PUBLIC_KEY}"
          test -n "${PUBLISHER_KEY_ID}"
          publisher_key="${RUNNER_TEMP}/publisher-public.pem"
          grant_key="${RUNNER_TEMP}/grant-private.pem"
          umask 077
          printf '%s\n' "${PUBLISHER_PUBLIC_KEY}" > "${publisher_key}"
          openssl ecparam -name prime256v1 -genkey -noout -out "${grant_key}"
          scripts/prepare-security.sh \
            --bundles runtime/modules/inbox \
            --publisher-key "${publisher_key}" \
            --publisher-key-id "${PUBLISHER_KEY_ID}" \
            --grant-private-key "${grant_key}" \
            --output runtime/security

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Enable rootless namespace acceptance on the ephemeral runner
        shell: bash
        run: |
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "${restriction}" && "$(<"${restriction}")" == 1 ]]; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run released browser-to-audit acceptance
        shell: bash
        env:
          E2E_PASSWORD: ${{ secrets.PHASE5_E2E_PASSWORD }}
          MURCHALKA_OLLAMA_MODEL: ${{ inputs.ollama_model || 'llama3.2:1b' }}
          MURCHALKA_WEB_ROOT: ${{ github.workspace }}/murchalka-web
        run: |
          test -n "${E2E_PASSWORD}"
          printf '%s\n' \
            "MURCHALKA_RUNTIME_IMAGE=${{ steps.components.outputs.runtime_image }}" \
            "OLLAMA_IMAGE=${{ steps.components.outputs.ollama_image }}" \
            "MURCHALKA_WEB_IMAGE=${{ steps.components.outputs.web_image }}" \
            > .env
          printf '%s\n' "${E2E_PASSWORD}" | scripts/phase5-e2e.sh --password-stdin

      - name: Collect container logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f compose/compose.yaml logs --no-color || true
