name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write
jobs:
  phase8-acceptance:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/phase8-e2e.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      BUNDLE_PUBLISHER_PUBLIC_KEY_PEM: ${{ secrets.BUNDLE_PUBLISHER_PUBLIC_KEY_PEM }}
      MURCHALKA_BUNDLE_SIGNING_KEY_ID: ${{ secrets.MURCHALKA_BUNDLE_SIGNING_KEY_ID }}
  phase7-acceptance:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/phase7-e2e.yml
    with:
      tag: v0.4.3
    secrets:
      BUNDLE_PUBLISHER_PUBLIC_KEY_PEM: ${{ secrets.BUNDLE_PUBLISHER_PUBLIC_KEY_PEM }}
      MURCHALKA_BUNDLE_SIGNING_KEY_ID: ${{ secrets.MURCHALKA_BUNDLE_SIGNING_KEY_ID }}
  phase6-acceptance:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/phase6-e2e.yml
    with:
      tag: v0.3.4
    secrets:
      BUNDLE_PUBLISHER_PUBLIC_KEY_PEM: ${{ secrets.BUNDLE_PUBLISHER_PUBLIC_KEY_PEM }}
      MURCHALKA_BUNDLE_SIGNING_KEY_ID: ${{ secrets.MURCHALKA_BUNDLE_SIGNING_KEY_ID }}
  phase5-acceptance:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/phase5-e2e.yml
    with:
      tag: v0.3.4
      ollama_model: llama3.2:1b
    secrets:
      BUNDLE_PUBLISHER_PUBLIC_KEY_PEM: ${{ secrets.BUNDLE_PUBLISHER_PUBLIC_KEY_PEM }}
      MURCHALKA_BUNDLE_SIGNING_KEY_ID: ${{ secrets.MURCHALKA_BUNDLE_SIGNING_KEY_ID }}
      PHASE5_E2E_PASSWORD: ${{ secrets.PHASE5_E2E_PASSWORD }}
  release:
    needs: [phase5-acceptance, phase6-acceptance, phase7-acceptance, phase8-acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }
      - id: version
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
      - name: Validate release metadata
        run: test "$(jq -r '.deploymentTag' releases/protocol-modules.lock.json)" = "${GITHUB_REF_NAME}"
      - name: Prepare resumable draft release
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          is_draft="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${is_draft}" == "false" ]]; then
            echo "Published release already exists and remains immutable." >&2
            exit 1
          fi
          if [[ -z "${is_draft}" ]]; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
          fi
      - name: Authenticate to GitHub Packages
        env: { PACKAGE_TOKEN: "${{ github.token }}" }
        run: dotnet nuget update source murchalka --username "${GITHUB_ACTOR}" --password "${PACKAGE_TOKEN}" --store-password-in-clear-text --configfile NuGet.Config
      - run: dotnet restore Murchalka.Deployment.slnx --configfile NuGet.Config
      - run: dotnet format Murchalka.Deployment.slnx --verify-no-changes --no-restore
      - run: dotnet build Murchalka.Deployment.slnx -c Release --no-restore
      - run: dotnet run --project tests/Murchalka.Deployment.Tests/Murchalka.Deployment.Tests.csproj -c Release --no-build --no-restore -- -reporter quiet
      - run: docker compose --env-file .env.example -f compose/compose.yaml config --quiet
      - run: docker compose --env-file .env.example -f compose/compose.yaml -f compose/compose.macos.yaml config --quiet
      - run: NODE_CA_PASSWORD=validation NODE_ADMIN_TOKEN=validation NODE_ENROLLMENT_TOKEN=validation MURCHALKA_NODE_CONTROLLER_IMAGE=controller:0.3.2 MURCHALKA_NODE_RUNTIME_IMAGE=node:0.3.4 docker compose -f compose/compose.phase6.yaml config --quiet
      - run: MURCHALKA_RUNTIME_IMAGE=runtime:0.4.1 PHASE7_BUNDLE_DIR=/tmp/bundles PHASE7_SECURITY_DIR=/tmp/security docker compose -f compose/compose.phase7.yaml config --quiet
      - run: MURCHALKA_RUNTIME_IMAGE=runtime:0.5.0 PHASE8_BUNDLE_DIR=/tmp/bundles PHASE8_SECURITY_DIR=/tmp/security docker compose -f compose/compose.phase8.yaml config --quiet
      - run: MURCHALKA_RUNTIME_IMAGE=runtime:0.5.0 SOCAT_IMAGE=socat:validation PHASE8_BUNDLE_DIR=/tmp/bundles PHASE8_SECURITY_DIR=/tmp/security docker compose -f compose/compose.phase8.yaml -f compose/compose.phase8.macos.yaml config --quiet
      - run: bash -n scripts/install-bundle.sh scripts/bootstrap.sh scripts/prepare-security.sh scripts/prepare-node-security.sh scripts/phase5-e2e.sh scripts/phase6-e2e.sh scripts/phase7-e2e.sh scripts/phase8-e2e.sh
      - run: PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" python3 -m py_compile scripts/coordinated-release.py scripts/tests/test_coordinated_release.py
      - run: PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Package deployment
        run: |
          mkdir -p artifacts
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner -czf "artifacts/murchalka-deployment-${{ steps.version.outputs.value }}.tar.gz" profiles bindings configuration compose scripts tools docs releases Directory.Build.props Directory.Packages.props NuGet.Config global.json README.md SECURITY.md .env.example
          (cd artifacts && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/attest-build-provenance@v3
        with: { subject-path: 'artifacts/*.tar.gz' }
      - name: Publish immutable GitHub Release
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release upload "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
