name: murchalka-minimal
services:
  module-loader:
    image: ${MURCHALKA_RUNTIME_IMAGE:?Pin MURCHALKA_RUNTIME_IMAGE in .env}
    user: "0"
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        rm -f /var/lib/murchalka/modules/inbox/*.murchalka &&
        rm -rf /var/lib/murchalka/configuration/grants &&
        install -d -m 0700 /var/lib/murchalka/configuration/grants &&
        cp /bundles/*.murchalka /var/lib/murchalka/modules/inbox/ &&
        cp /security/admin-token /var/lib/murchalka/configuration/admin-token &&
        cp /security/trusted-publishers.json /var/lib/murchalka/configuration/trusted-publishers.json &&
        cp -R /security/grants/. /var/lib/murchalka/configuration/grants/ &&
        chmod 0600 /var/lib/murchalka/configuration/admin-token /var/lib/murchalka/configuration/trusted-publishers.json &&
        chmod -R u=rwX,go= /var/lib/murchalka/configuration/grants &&
        chown -R "$${APP_UID}:$${APP_UID}" /var/lib/murchalka
    read_only: true
    volumes:
      - runtime-state:/var/lib/murchalka
      - ../runtime/modules/inbox:/bundles:ro
      - ../runtime/security:/security:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    restart: "no"
  sandbox-probe:
    image: ${MURCHALKA_RUNTIME_IMAGE:?Pin MURCHALKA_RUNTIME_IMAGE in .env}
    entrypoint: [/usr/local/libexec/murchalka-netns-exec]
    command:
      - /usr/bin/bwrap
      - --die-with-parent
      - --new-session
      - --unshare-ipc
      - --unshare-pid
      - --unshare-uts
      - --cap-drop
      - ALL
      - --ro-bind
      - /
      - /
      - --proc
      - /proc
      - --dev
      - /dev
      - --
      - /usr/bin/true
    read_only: true
    tmpfs: [/tmp]
    userns_mode: host
    security_opt: [no-new-privileges:true, seccomp=unconfined, apparmor=unconfined, systempaths=unconfined]
    cap_drop: [ALL]
    restart: "no"
  runtime:
    image: ${MURCHALKA_RUNTIME_IMAGE:?Pin MURCHALKA_RUNTIME_IMAGE in .env}
    environment:
      MURCHALKA_LINUX_NETWORK_ISOLATION: namespace-launcher
    command:
      - --root
      - /var/lib/murchalka
      - --url
      - http://127.0.0.1:5078
      - --installation
      - minimal-core
      - --bootstrap-bindings
      - /etc/murchalka/bootstrap/minimal.bindings.yaml
      - --bootstrap-configuration
      - /etc/murchalka/bootstrap/configuration
      - --admin-token-file
      - /var/lib/murchalka/configuration/admin-token
    network_mode: host
    read_only: true
    tmpfs: [/tmp]
    userns_mode: host
    volumes:
      - runtime-state:/var/lib/murchalka
      - ../bindings/minimal.bindings.yaml:/etc/murchalka/bootstrap/minimal.bindings.yaml:ro
      - ../configuration:/etc/murchalka/bootstrap/configuration:ro
    # The outer container keeps no Linux capabilities. The host user namespace
    # and unconfined namespace-related restrictions allow rootless bwrap to
    # create the inner per-module sandbox.
    security_opt: [no-new-privileges:true, seccomp=unconfined, apparmor=unconfined, systempaths=unconfined]
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on:
      ollama: { condition: service_started }
      module-loader: { condition: service_completed_successfully }
      sandbox-probe: { condition: service_completed_successfully }
  ollama:
    image: ${OLLAMA_IMAGE:?Pin OLLAMA_IMAGE in .env}
    network_mode: host
    volumes: [ollama-state:/root/.ollama]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  web:
    image: ${MURCHALKA_WEB_IMAGE:?Pin MURCHALKA_WEB_IMAGE in .env}
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  runtime-state: {}
  ollama-state: {}
